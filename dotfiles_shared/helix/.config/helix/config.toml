theme = "solarized_light"

[keys.normal]
"C-t" = [
    ":run-shell-command kitty @ launch --no-response --type=overlay --cwd=current tig",
    ":redraw",
    ":reload-all",
    ":reload",
]

# Merges into the default space menu rather than replacing it.
# :update writes only when the buffer is modified, so mashing this
# won't re-run the formatter or bump mtime under a file watcher.
[keys.normal.space]
u = ":update"

# Toggle the file-picker filters, so `space /` and `space f` also reach
# gitignored and hidden files. git-ignore goes last so the status line
# reports it. Add file-picker.git-global / .git-exclude / .parents here
# if those ever need toggling too.
i = [":toggle file-picker.hidden", ":toggle file-picker.git-ignore"]

# Git submenu, same key sequence as the Kakoune mapping (space t b).
# tig gets a kitty overlay window, so Helix keeps its own screen intact.
# `t` renders as a blank row in the space menu: a submenu built from config
# always gets an empty name (KeyTrieNode::new("", ..) in helix keymap.rs),
# and infobox() prints no line for an empty description. Nothing to fix here.
[keys.normal.space.t]
b = ":run-shell-command kitty @ launch --no-response --type=overlay --cwd=current tig blame +%{cursor_line} -- \"%{file_path_absolute}\""

[keys.insert]
C-c = "normal_mode"

[editor.file-picker]
hidden = false
