# TypeScript 7 (tsgo) as the LSP for TS/JS.
# tsgo-lsp (~/.local/bin) resolves the repo-local @typescript/native binary.
# tsgo is pull-diagnostics-only (textDocument/diagnostic); Helix >= 25.01 supports that.

[language-server.tsgo]
command = "tsgo-lsp"

[[language]]
name = "typescript"
language-servers = ["tsgo"]

[[language]]
name = "tsx"
language-servers = ["tsgo"]

[[language]]
name = "javascript"
language-servers = ["tsgo"]

[[language]]
name = "jsx"
language-servers = ["tsgo"]

# prettierd (pnpm global) rather than plain prettier: it keeps a daemon warm, so
# format-on-write doesn't pay node startup every time.
#
# Helix expands %{...} in formatter args and runs the formatter with cwd set to
# the buffer's directory, so prettier gets the real path and resolves the nearest
# .prettierrc from it. Use file_path_absolute, not buffer_name: buffer_name is
# relative to Helix's cwd, which is not the formatter's cwd.

[[language]]
name = "json"
formatter = { command = "prettierd", args = ["%{file_path_absolute}"] }
auto-format = true

# Prettier defaults to trailing commas in jsonc, which several consumers of the
# format reject (waybar's parser among them). Force them off.
[[language]]
name = "jsonc"
formatter = { command = "prettierd", args = ["%{file_path_absolute}", "--trailing-comma=none"] }
auto-format = true

# Prose wraps at the viewport instead of running off the right edge.
# Per-language soft-wrap overrides the global default, so only markdown
# buffers get it.

[[language]]
name = "markdown"
soft-wrap = { enable = true }
