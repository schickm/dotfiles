[main]
fields=filename,name,generic,keywords
# Terminal=true desktop entries (htop and friends) need the launcher to wrap
# them in a terminal. Fuzzel's default for that is "$TERMINAL -e", and
# TERMINAL isn't set in the session, so they silently did nothing.
terminal=kitty
font=SF Pro Text:size=13
icon-theme=Papirus

# Pale cool-gray (base1 blended toward white), matching the waybar treatment.
[colors]
background=dee3e3f2
text=002b36ff
prompt=586e75ff
placeholder=586e75ff
input=002b36ff
match=268bd2ff
selection=bec7c7ff
selection-text=002b36ff
selection-match=268bd2ff
border=93a1a1ff

[border]
width=2
radius=8
