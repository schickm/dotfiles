# Drop-down terminal for one-off Claude sessions (niri bind: Mod+Grave).
# Options: kitten quick-access-terminal --help, or
# https://sw.kovidgoyal.net/kitty/kittens/quick-access-terminal/

edge top
lines 20
# Centered on the 3440px ultrawide; full width elsewhere minus these margins.
margin_left 1040
margin_right 1040
background_opacity 0.95
# on-demand lets other windows take keyboard focus while it is shown.
focus_policy on-demand
hide_on_focus_loss no
