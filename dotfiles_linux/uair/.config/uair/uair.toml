# taken from
# https://www.thenegation.com/posts/pomodoro-waybar-uair/
# "man 5 uair" for config options

loop_on_end = true

[defaults]
format = "{time}\n"
paused_state_text = "paused"
resumed_state_text = "resumed"
# "-" suppresses padding, so the bar shows 9:05 rather than 09:05 — one less
# character in a module that's only ever glanced at.
time_format = "%-M:%S"

[[sessions]]
id = "work"
name = "Work"
duration = "52m"
command = "notify-send 'Work Done!'"

[[sessions]]
id = "shortwork"
name = "Short Work"
duration = "30m"
command = "notify-send 'Short Work Done!'"

[[sessions]]
id = "rest"
name = "Rest"
duration = "17m"
command = "notify-send 'Rest Done!'"

